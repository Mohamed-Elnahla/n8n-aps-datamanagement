name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish public community package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Release builds must not restore a dependency cache containing code
          # that was produced outside this trusted workflow run.
          package-manager-cache: false

      - name: Install dependencies
        # Publish lifecycle scripts remain enabled later when n8n-node release
        # invokes npm publish. Only dependency installation scripts are skipped.
        run: npm ci --ignore-scripts

      - name: Verify release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release version $RELEASE_VERSION"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # npm exchanges GitHub's short-lived OIDC identity for publish access.
      # Do not add NODE_AUTH_TOKEN here: it would make npm fall back to the
      # deprecated long-lived token flow instead of trusted publishing.
      - name: Publish with npm trusted publishing and provenance
        run: npm run release
